      <div class="hud roller" id="roller">
        <h3>Rolador de parada</h3>
        <p class="sub">Monte a parada e role. A escada ao lado acende no degrau que saiu.</p>
        <div class="controls">
          <div class="ctl"><label for="r-pool">Parada</label><select id="r-pool"></select></div>
          <div class="ctl"><label for="r-auto">Autocontrole</label><select id="r-auto"></select></div>
          <div class="ctl"><label for="r-dif">Dificuldade</label><select id="r-dif"></select></div>
        </div>
        <button class="btn" id="r-go" type="button">Rolar</button>
        <div class="tray" id="r-tray" aria-live="polite"></div>
        <div class="legend"><i><span class="sw t"></span>Tensão</i><i><span class="sw"></span>Normal</i><i>↻ explosão</i></div>
        <div class="readout" id="r-out"></div>
      </div>
